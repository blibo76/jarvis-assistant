<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Arc Reactor Core -->
        <div class="arc-reactor-container">
            <div class="arc-reactor">
                <div class="reactor-core">
                    <div class="core-inner">
                        <div class="core-light"></div>
                        <div class="pulse"></div>
                    </div>
                </div>
                <div class="reactor-ring reactor-ring-1"></div>
                <div class="reactor-ring reactor-ring-2"></div>
                <div class="reactor-ring reactor-ring-3"></div>
                <div class="reactor-glow"></div>
            </div>
            <div class="status-indicator">
                <span id="status-text">Standby</span>
                <div class="status-light" id="status-light"></div>
            </div>
        </div>

        <!-- Voice Box / Control Panel -->
        <div class="control-panel">
            <div class="panel-header">
                <h1>J.A.R.V.I.S</h1>
                <p>Just A Rather Very Intelligent System</p>
            </div>

            <!-- Microphone Section -->
            <div class="microphone-section">
                <button id="mic-button" class="mic-button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v12a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <span>Say "JARVIS"</span>
                </button>
                <p class="mic-hint">Press the button or say "JARVIS" to activate</p>
            </div>

            <!-- Chat Display -->
            <div class="chat-display">
                <div id="chat-messages" class="chat-messages">
                    <div class="message system-message">
                        <p>J.A.R.V.I.S online. Ready to assist, sir.</p>
                    </div>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="text-input" 
                    placeholder="Type your command here or press the microphone..."
                    class="text-input"
                >
                <button id="send-button" class="send-button">Send</button>
            </div>

            <!-- Settings -->
            <div class="settings">
                <label>
                    <input type="checkbox" id="voice-toggle" checked>
                    <span>Voice Response</span>
                </label>
                <label>
                    <input type="checkbox" id="listening-toggle" checked>
                    <span>Voice Recognition</span>
                </label>
                <select id="voice-select">
                    <option value="default">Default Voice</option>
                    <option value="deep">Deep Voice</option>
                    <option value="robotic">Robotic</option>
                </select>
            </div>
        </div>

        <!-- Side Info Panel -->
        <div class="info-panel">
            <div class="info-section">
                <h3>System Status</h3>
                <ul id="system-status">
                    <li>Status: <span id="sys-status">Active</span></li>
                    <li>CPU: <span id="sys-cpu">42%</span></li>
                    <li>Memory: <span id="sys-memory">1.8GB</span></li>
                    <li>Voice: <span id="sys-voice">Ready</span></li>
                </ul>
            </div>
            <div class="info-section">
                <h3>Recent Commands</h3>
                <ul id="recent-commands">
                    <li>System initialized</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="speech-recognition.js"></script>
    <script src="jarvis.js"></script>
</body>
</html>
